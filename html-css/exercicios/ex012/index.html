<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos HTML</title>
</head>
<body>
    <h1>Inserir Vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video width="560" controls autoplay poster="imagens/ilustracao.jpg" loop>
        <source src="midia/video-720p.mp4" type="video/mp4">
        <source src="midia/video-webm.webm" type="video/webm">
        <source src="midia/video-m4v.m4v" type="video/m4v">
        <source src="midia/video-ogvp.ogv" type="video/ogv">
        <p>Seu navegador não tem compatibilidade com este video.</p>

    </video>

    <h1>Inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/iEmcrX8-r58?si=3n3MpqYBG3Hlhy02" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    

</body>
</html>
